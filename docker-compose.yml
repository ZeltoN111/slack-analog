services:
  postgres:
    image: postgres:16-alpine
    container_name: slack_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: slack_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Mount local source → container so file changes are instant (hot-reload).
    volumes:
      - ./app:/app/app
    # Override Dockerfile CMD: --reload watches /app for changes.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
